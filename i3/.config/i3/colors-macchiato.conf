# Catppuccin Macchiato — i3 colors (included by config; swapped by `theme`)
set $base     #24273a
set $mantle   #1e2030
set $crust    #181926
set $text     #cad3f5
set $subtext1 #b8c0e0
set $surface0 #363a4f
set $surface1 #494d64
set $surface2 #5b6078
set $blue     #8aadf4
set $lavender #b7bdf8
set $teal     #8bd5ca
set $green    #a6da95
set $yellow   #eed49f
set $peach    #f5a97f
set $red      #ed8796
set $mauve    #c6a0f6

# class                 border    bground   text      indicator   child_border
client.focused          $blue     $base     $text     $lavender   $blue
client.focused_inactive $surface1 $base     $subtext1 $surface1   $surface1
client.unfocused        $surface0 $mantle   $surface2 $surface0   $surface0
client.urgent           $red      $base     $text     $red        $red
client.placeholder      $base     $crust    $text     $base       $base
client.background       $base
