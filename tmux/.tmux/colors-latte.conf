# Catppuccin Latte (contrast-corrected) — tmux colors
set -g status-style "bg=#eff1f5,fg=#4c4f69"
set -g status-left "#[bg=#165eed,fg=#eff1f5,bold]  #S #[bg=#eff1f5,fg=#165eed] "
set -g status-right "#[fg=#83869a]│ #[fg=#5c5f77]%a %b %d #[fg=#83869a]│ #[fg=#165eed]%H:%M "
setw -g window-status-format "#[fg=#676a80] #I:#W "
setw -g window-status-current-format "#[bg=#ccd0da,fg=#0b3fbd,bold] #I:#W "
set -g pane-border-style "fg=#83869a"
set -g pane-active-border-style "fg=#165eed"
set -g message-style "bg=#ccd0da,fg=#4c4f69"
set -g message-command-style "bg=#ccd0da,fg=#4c4f69"
setw -g mode-style "bg=#bcc0cc,fg=#4c4f69"
setw -g clock-mode-colour "#165eed"
