# Catppuccin Macchiato — dunst colors
# Linked into dunstrc.d/50-colors.conf by `theme dark`; overrides dunstrc.
[global]
    frame_color = "#8aadf4"
    icon_theme = Papirus-Dark

[urgency_low]
    background = "#24273a"
    foreground = "#cad3f5"
    frame_color = "#8aadf4"

[urgency_normal]
    background = "#24273a"
    foreground = "#cad3f5"
    frame_color = "#8aadf4"

[urgency_critical]
    background = "#24273a"
    foreground = "#cad3f5"
    frame_color = "#ed8796"
