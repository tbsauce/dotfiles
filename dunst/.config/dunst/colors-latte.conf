# Catppuccin Latte (contrast-corrected) — dunst colors
# Linked into dunstrc.d/50-colors.conf by `theme dark`; overrides dunstrc.
[global]
    frame_color = "#165eed"
    icon_theme = Papirus-Light

[urgency_low]
    background = "#eff1f5"
    foreground = "#4c4f69"
    frame_color = "#165eed"

[urgency_normal]
    background = "#eff1f5"
    foreground = "#4c4f69"
    frame_color = "#165eed"

[urgency_critical]
    background = "#eff1f5"
    foreground = "#4c4f69"
    frame_color = "#d20f39"
