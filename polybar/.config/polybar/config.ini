; Polybar config — Catppuccin (flavor switched by `theme`)

; Colors — colors.ini is a generated symlink -> colors-macchiato.ini | colors-latte.ini
; Switch with: theme light | theme dark | theme toggle
include-file = ~/.config/polybar/colors.ini

[bar/main]
width = 100%
height = 30pt
radius = 0

background = ${colors.base}
foreground = ${colors.text}

line-size = 3pt

border-bottom-size = 2pt
border-bottom-color = ${colors.surface0}

padding-left = 1
padding-right = 2

module-margin = 1

separator = |
separator-foreground = ${colors.surface2}

font-0 = JetBrainsMono Nerd Font Mono:size=10;3
font-1 = JetBrainsMono Nerd Font Mono:size=13;4
font-2 = JetBrainsMono Nerd Font Mono:size=16;4

modules-left = i3
modules-right = pulseaudio backlight cpu memory filesystem battery wlan date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

tray-position = right
tray-padding = 4
tray-background = ${colors.base}

wm-restack = i3

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = true

label-focused = %index%
label-focused-background = ${colors.surface0}
label-focused-foreground = ${colors.blue}
label-focused-underline = ${colors.blue}
label-focused-padding = 2

label-unfocused = %index%
label-unfocused-foreground = ${colors.surface2}
label-unfocused-padding = 2

label-visible = %index%
label-visible-foreground = ${colors.subtext0}
label-visible-padding = 2

label-urgent = %index%
label-urgent-background = ${colors.red}
label-urgent-foreground = ${colors.base}
label-urgent-padding = 2

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "󰖀 "
format-volume-prefix-foreground = ${colors.blue}
format-volume = <label-volume>
label-volume = %percentage%%
label-volume-minlen = 5
label-volume-alignment = right
label-volume-foreground = ${colors.text}

format-muted-prefix = "󰖀 "
format-muted-prefix-foreground = ${colors.red}
label-muted = muted
label-muted-minlen = 5
label-muted-alignment = right
label-muted-foreground = ${colors.surface2}

click-right = pavucontrol

[module/backlight]
type = internal/backlight
card = amdgpu_bl1

format-prefix = "󰖨 "
format-prefix-foreground = ${colors.yellow}
label = %percentage%%
label-minlen = 4
label-alignment = right

[module/memory]
type = internal/memory
interval = 5

format-prefix = "󰍛 "
format-prefix-foreground = ${colors.mauve}
label = %percentage_used%%
label-minlen = 4
label-alignment = right

[module/cpu]
type = internal/cpu
interval = 5

format-prefix = "󰾅 "
format-prefix-foreground = ${colors.teal}
label = %percentage%%
label-minlen = 4
label-alignment = right

[module/filesystem]
type = internal/fs
interval = 30
mount-0 = /

format-mounted-prefix = "󰆼 "
format-mounted-prefix-foreground = ${colors.peach}
label-mounted = %percentage_used%%
label-mounted-minlen = 4
label-mounted-alignment = right

[module/battery]
type = internal/battery
battery = BAT0
adapter = ACAD
full-at = 98
low-at = 15

format-charging-prefix = "󰂄 "
format-charging-prefix-foreground = ${colors.green}
format-charging = <label-charging>
label-charging = %percentage%%
label-charging-minlen = 4
label-charging-alignment = right

format-discharging-prefix = "󰁿 "
format-discharging-prefix-foreground = ${colors.yellow}
format-discharging = <label-discharging>
label-discharging = %percentage%%
label-discharging-minlen = 4
label-discharging-alignment = right

format-full-prefix = "󰁹 "
format-full-prefix-foreground = ${colors.green}
label-full = full

format-low-prefix = "󰂃 "
format-low-prefix-foreground = ${colors.red}
label-low = %percentage%%
label-low-minlen = 4
label-low-alignment = right

[module/wlan]
type = internal/network
interface-type = wireless
interval = 5

format-connected-prefix = "%{T3}󰤨%{T-} "
format-connected-prefix-foreground = ${colors.teal}
label-connected = %essid%

format-disconnected-prefix = "%{T3}󰤭%{T-} "
format-disconnected-prefix-foreground = ${colors.red}
label-disconnected = off
label-disconnected-foreground = ${colors.surface2}

[module/date]
type = internal/date
interval = 30

date = %a %b %d
time = %H:%M

format-prefix = " "
format-prefix-foreground = ${colors.blue}
label = %date%  %time%

[settings]
screenchange-reload = true
pseudo-transparency = true
