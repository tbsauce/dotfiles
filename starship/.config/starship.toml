# Starship prompt — Catppuccin (palette line switched by `theme`)

palette = "catppuccin_latte"

format = """
$line_break\
[╭─ ](overlay0)\
$directory\
$git_branch\
$git_status\
$cmd_duration\
$line_break\
$character"""

[directory]
style = "bold lavender"
format = "[$path](bold lavender) "
truncation_length = 0

[git_branch]
symbol = ""
style = "bold mauve"
format = "[on](overlay1) [$symbol $branch](bold mauve)"

[git_status]
style = "bold yellow"
format = " [$all_status$ahead_behind](bold yellow)"

[cmd_duration]
min_time = 2_000
style = "bold peach"
format = " [󰔟 $duration](bold peach)"

[character]
success_symbol = "[╰─ ❯](overlay0)"
error_symbol = "[╰─ ❯](red)"

[palettes.catppuccin_macchiato]
rosewater = "#f4dbd6"
flamingo = "#f0c6c6"
pink = "#f5bde6"
mauve = "#c6a0f6"
red = "#ed8796"
maroon = "#ee99a0"
peach = "#f5a97f"
yellow = "#eed49f"
green = "#a6da95"
teal = "#8bd5ca"
sky = "#91d7e3"
sapphire = "#7dc4e4"
blue = "#8aadf4"
lavender = "#b7bdf8"
text = "#cad3f5"
subtext1 = "#b8c0e0"
subtext0 = "#a5adcb"
overlay2 = "#939ab7"
overlay1 = "#8087a2"
overlay0 = "#6e738d"
surface2 = "#5b6078"
surface1 = "#494d64"
surface0 = "#363a4f"
base = "#24273a"
mantle = "#1e2030"
crust = "#181926"

[palettes.catppuccin_latte]
# Contrast-corrected Latte: accents darkened in OKLCH with hue held, all >=4.5:1
# on base #eff1f5. overlay0/overlay1 are raised because the prompt frame and the
# "on" connector are drawn with them and stock Latte puts them at 2.3-2.8:1.
rosewater = "#c67260"
flamingo = "#aa414b"
pink = "#b9349c"
mauve = "#8838ef"
red = "#d20f39"
maroon = "#a61b22"
peach = "#ba4a00"
yellow = "#8c5500"
