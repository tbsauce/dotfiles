# Catppuccin Latte (contrast-corrected) — kitty colors + light-mode typography
#
# Stock Catppuccin Latte accents measure 2.3–3.3:1 against its own base, because
# they were designed as hue-matched siblings of the dark flavors rather than as
# body text on a near-white background. Every value here is >=4.5:1 on #eff1f5
# (WCAG AA) with the Catppuccin hue held; verified, not eyeballed.
#
# Two inversions from the official Latte mapping, both deliberate:
#   * color7/color15 are text/near-black, NOT surface2/surface1. On a light
#     background those greys sit just under the bg (1.9:1 / 1.6:1) and any app
#     asking for "white" disappears.
#   * "bright" (8-15) means DARKER here, not lighter. Bright = more contrast,
#     and on a light background more contrast is darker. color8 is the one
#     exception: its role is de-emphasis, so it stays the lightest neutral.

# ── Typography: light mode needs more stem weight than dark ──
# Dark-on-light reads thinner than light-on-dark at identical weight (optical
# irradiation + gamma-encoded AA blending). Two independent corrections:
#
# 1. Gamma. Per kitty docs the first number "controls the thickness of dark text
#    on light backgrounds... light text on dark backgrounds is affected very
#    little" — so this is scoped here and provably cannot affect Macchiato.
#    Raise toward 1.7 (the macOS default) for thicker, lower to 1.0 to disable.
text_composition_strategy 1.35 0
#
# 2. Medium face. NOTE the family=/style= form is mandatory: the bare string
#    "JetBrainsMono Nerd Font Medium" is not a family name and silently falls
#    back to Noto Sans Mono. All four faces are pinned because `auto` italic
#    would resolve to Regular Italic — thinner than the surrounding roman text.
font_family      family="JetBrainsMono Nerd Font" style=Medium
bold_font        family="JetBrainsMono Nerd Font" style=Bold
italic_font      family="JetBrainsMono Nerd Font" style="Medium Italic"
bold_italic_font family="JetBrainsMono Nerd Font" style="Bold Italic"

foreground              #4c4f69
background              #eff1f5

# `none` keeps each token's own colour and tints only the background
selection_foreground    none
selection_background    #ccd0da

cursor                  #a2402a
cursor_text_color       #eff1f5
cursor_beam_thickness   2.0

# SGR-2 dim text washes out badly on a light background
dim_opacity             0.9

url_color               #0a4bcd

active_border_color     #0b55ea
inactive_border_color   #83869a
bell_border_color       #965c0c

active_tab_foreground   #eff1f5
active_tab_background   #8839ef
inactive_tab_foreground #4c4f69
inactive_tab_background #e6e9ef
tab_bar_background      #dce0e8

# Mark colors — backgrounds darkened so the white mark text is legible
mark1_foreground #eff1f5
mark1_background #0a4bcd
mark2_foreground #eff1f5
mark2_background #8839ef
mark3_foreground #eff1f5
mark3_background #026d97

# ── Normal colors ───────────────────  contrast vs #eff1f5
color0  #383b52
color1  #d20f39
color2  #317821
color3  #965c0c
color4  #0b55ea
color5  #8839ef
color6  #13777c
color7  #4c4f69

# ── Bright colors (darker, not lighter) ──
# color8 is the exception: "bright black" means de-emphasised, so it stays the
# lightest neutral — but clamped at ~5:1 instead of fading into the background.
# zsh-autosuggestions uses fg=8 by default, so this slot is high-traffic.
color8  #63667d
color9  #b50d31
color10 #2a691c
color11 #b74300
color12 #0a4bcd
color13 #b91d90
color14 #026d97
color15 #2c2f42
