# Kitty — Catppuccin (flavor switched by `theme`)

shell /usr/bin/zsh

# Font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11

# Cursor
cursor_shape beam
cursor_blink_interval 0.5

# Window
window_padding_width 8
confirm_os_window_close 0
background_opacity 1.0

# Bell
enable_audio_bell no

# Ligatures
disable_ligatures never

# Scrollback
scrollback_lines 10000

# ── Colors (Catppuccin) ──
# colors.conf is a generated symlink -> colors-macchiato.conf | colors-latte.conf
# Switch with: theme light | theme dark | theme toggle
include colors.conf
